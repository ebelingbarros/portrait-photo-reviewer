<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151923"><title>Portrait Photo Reviewer</title><style>body{font-family:system-ui;background:#151923;color:white;margin:0}header,footer{padding:12px;background:#242b39;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,input{font:inherit;padding:10px;border-radius:8px}button{background:#87bfff;border:0;color:#111}button:disabled{opacity:.4}main{padding:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile{position:relative;border:4px solid transparent;background:#333;padding:0}.tile.keep{border-color:#3bdf88}.tile img{width:100%;aspect-ratio:2/3;object-fit:contain;display:block}.tile span{position:absolute;top:5px;right:5px;background:#111b;padding:4px;border-radius:4px}.muted{color:#bbc4d5}#status{padding:12px}#preview{border:0;background:#111;color:white;max-width:100vw;max-height:100vh}#preview img{max-width:94vw;max-height:85vh}</style></head><body><header><strong>Portrait Photo Reviewer</strong><button id="login">Connect Dropbox</button><button id="logout" hidden>Disconnect</button></header><main><section id="setup"><p>Enter the Dropbox App Key from your developer console. Configure the OAuth redirect URI to match the exact URL of this page (without the # fragment).</p><input id="key" placeholder="Dropbox App Key" autocomplete="off"><button id="save">Save key & connect</button><p class="muted">Required Dropbox scopes: files.metadata.read, files.content.read, files.content.write. Use a dedicated test folder first.</p></section><section id="browser" hidden><label>Parent folder <input id="folder" value="/PhotoReviewTest"></label><button id="load">Load albums</button><label>Columns <select id="cols"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option></select></label><p id="album"></p><p id="counts"></p><div class="grid" id="grid"></div><footer><button id="prev">← Previous</button><button id="next">Next Album →</button><button id="undo">Undo last album</button></footer></section><p id="status" role="status"></p></main><dialog id="preview"><button id="close">Close</button><img id="large" alt="Large preview"></dialog><script>
(()=>{'use strict';const $=id=>document.getElementById(id),status=t=>$('status').textContent=t;let token=sessionStorage.getItem('dbx_token'),albums=[],index=0,files=[],kept=new Set(),lastUndo=null,busy=false;const api='https://api.dropboxapi.com/2/',content='https://content.dropboxapi.com/2/';const natural=new Intl.Collator(undefined,{numeric:true,sensitivity:'base'});function key(){return localStorage.getItem('dbx_app_key')||''}function base(){return location.origin+location.pathname}function auth(){let verifier=Array.from(crypto.getRandomValues(new Uint8Array(48)),b=>('0'+b.toString(16)).slice(-2)).join('');sessionStorage.setItem('pkce_verifier',verifier);crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)).then(d=>{let s=btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');location.href='https://www.dropbox.com/oauth2/authorize?'+new URLSearchParams({client_id:key(),response_type:'code',redirect_uri:base(),code_challenge:s,code_challenge_method:'S256',token_access_type:'offline'});});}async function call(route,data){let r=await fetch(api+route,{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error(route+': '+(await r.text()).slice(0,350));return r.json()}async function thumbnail(path){let r=await fetch(content+'files/get_thumbnail_v2',{method:'POST',headers:{Authorization:'Bearer '+token,'Dropbox-API-Arg':JSON.stringify({resource:{'.tag':'path',path},format:'jpeg',size:'w640h480',mode:'fit'})}});if(!r.ok)throw Error('Thumbnail '+r.status);return URL.createObjectURL(await r.blob())}async function list(path){let result=await call('files/list_folder',{path,recursive:false,include_deleted:false,limit:2000}),entries=[...result.entries];while(result.has_more){result=await call('files/list_folder/continue',{cursor:result.cursor});entries.push(...result.entries)}return entries}function show(){ $('setup').hidden=!!token;$('browser').hidden=!token;$('login').hidden=!!token;$('logout').hidden=!token;$('key').value=key();$('undo').disabled=!lastUndo;$('next').disabled=busy||!albums.length;$('prev').disabled=busy||index===0}async function load(){try{busy=true;show();status('Loading folders…');let root=$('folder').value.trim().replace(/\/$/,'');if(root==='/' )root='';if(root&&!root.startsWith('/'))throw Error('Folder must start with /');localStorage.setItem('dbx_parent',root);let entries=await list(root);albums=entries.filter(e=>e['.tag']==='folder'&&!e.name.startsWith('APP REVIEWED ')).sort((a,b)=>natural.compare(a.name,b.name));index=0;lastUndo=null;await openAlbum();}catch(e){status(e.message)}finally{busy=false;show()}}async function openAlbum(){files=[];kept.clear();$('grid').replaceChildren();if(index>=albums.length){$('album').textContent='All albums reviewed';$('counts').textContent='';status('Finished');show();return}let album=albums[index];$('album').textContent=`Album ${index+1}/${albums.length}: ${album.name}`;status('Loading photos…');files=(await list(album.path_lower)).filter(e=>e['.tag']==='file'&&/\.(jpe?g|png|webp)$/i.test(e.name)).sort((a,b)=>natural.compare(a.name,b.name));$('counts').textContent=`0 selected / ${files.length} photos`;let grid=$('grid');for(let i=0;i<files.length;i++){let f=files[i],btn=document.createElement('button');btn.className='tile';btn.title=f.name;btn.innerHTML='<span>○</span>';btn.addEventListener('click',()=>{if(kept.has(f.id))kept.delete(f.id);else kept.add(f.id);btn.classList.toggle('keep',kept.has(f.id));btn.querySelector('span').textContent=kept.has(f.id)?'✓':'○';$('counts').textContent=`${kept.size} selected / ${files.length} photos`});btn.addEventListener('dblclick',async()=>{try{let url=await thumbnail(f.path_lower);$('large').src=url;$('preview').showModal()}catch(e){status(e.message)}});let img=document.createElement('img');img.alt=f.name;img.loading='lazy';btn.prepend(img);grid.append(btn);thumbnail(f.path_lower).then(url=>{if(btn.isConnected)img.src=url;else URL.revokeObjectURL(url)}).catch(()=>{img.alt='Preview unavailable: '+f.name})}status('Tap to keep. Double-tap to enlarge.');show()}async function next(){if(busy||!albums.length||index>=albums.length)return;busy=true;show();let album=albums[index],root=localStorage.getItem('dbx_parent')||'',holding=root+'/.PhotoReviewerUndo',tag=Date.now().toString(),undoPath=holding+'/'+tag,record={album:album.name,original:album.path_lower,moved:[],renamed:null,deletedAlbum:false};try{await call('files/create_folder_v2',{path:holding,autorename:false}).catch(e=>{if(!e.message.includes('conflict'))throw e});await call('files/create_folder_v2',{path:undoPath,autorename:false});let unwanted=files.filter(f=>!kept.has(f.id));for(let f of unwanted){status(`Moving ${record.moved.length+1}/${unwanted.length} to Undo…`);let dest=undoPath+'/'+f.name;await call('files/move_v2',{from_path:f.path_lower,to_path:dest,autorename:false});record.moved.push({from:f.path_lower,to:dest})}if(kept.size){let newPath=album.path_lower.replace(/\/[^/]+$/,'/')+'APP REVIEWED '+album.name;await call('files/move_v2',{from_path:album.path_lower,to_path:newPath,autorename:false});record.renamed=newPath}else{await call('files/delete_v2',{path:album.path_lower});record.deletedAlbum=true}lastUndo=record;albums.splice(index,1);await openAlbum();status('Album processed. Undo is available.');}catch(e){lastUndo=record;status('Processing interrupted: '+e.message+'. Use Undo before continuing.')}finally{busy=false;show()}}async function undo(){if(!lastUndo||busy)return;busy=true;show();let u=lastUndo;try{status('Restoring previous album…');if(u.renamed)await call('files/move_v2',{from_path:u.renamed,to_path:u.original,autorename:false});if(u.deletedAlbum)await call('files/create_folder_v2',{path:u.original,autorename:false});for(let item of [...u.moved].reverse())await call('files/move_v2',{from_path:item.to,to_path:item.from,autorename:false});lastUndo=null;await load();status('Previous album restored.');}catch(e){status('Undo incomplete: '+e.message+'. Do not continue; inspect the Dropbox holding folder.')}finally{busy=false;show()}}$('save').onclick=()=>{let k=$('key').value.trim();if(!k)return status('Enter Dropbox App Key');localStorage.setItem('dbx_app_key',k);auth()};$('login').onclick=()=>key()?auth():status('Enter an App Key first');$('logout').onclick=()=>{sessionStorage.removeItem('dbx_token');token=null;show()};$('load').onclick=load;$('next').onclick=next;$('undo').onclick=undo;$('prev').onclick=async()=>{if(index>0){index--;await openAlbum()}};$('cols').onchange=()=>{$('grid').style.gridTemplateColumns=`repeat(${$('cols').value},minmax(0,1fr))`};$('close').onclick=()=>{$('preview').close();URL.revokeObjectURL($('large').src);$('large').removeAttribute('src')};$('folder').value=localStorage.getItem('dbx_parent')||'/PhotoReviewTest';async function init(){let code=new URLSearchParams(location.search).get('code');if(code){try{let r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({code,grant_type:'authorization_code',client_id:key(),redirect_uri:base(),code_verifier:sessionStorage.getItem('pkce_verifier')||''})});let d=await r.json();if(!r.ok)throw Error(JSON.stringify(d));token=d.access_token;sessionStorage.setItem('dbx_token',token);history.replaceState({},'',base());status('Dropbox connected. Choose a test folder.')}catch(e){status('Login failed: '+e.message)}}show()}init();})();

</script></body></html>
